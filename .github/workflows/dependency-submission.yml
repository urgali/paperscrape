name: Dependency Submission

# Submits the *actually resolved* Gradle dependency graph (including transitive
# dependencies, after version conflict resolution) to GitHub's Dependency Graph API. Once
# submitted, GitHub's Dependabot automatically raises a security alert whenever a new CVE/OSV
# advisory is published for anything in that graph -- this is what turns point 6 of the audit
# ("scan dependencies for known vulnerabilities") into an ongoing, automated process instead of
# a one-time check that goes stale the moment a new CVE is disclosed.
#
# Requires "Dependabot alerts" to be enabled for this repository (Settings -> Code security ->
# Dependabot alerts) -- on by default for public repos, but worth confirming.
on:
  push:
    branches: [ "main" ]
  schedule:
    # Weekly, independent of any code push -- a dependency already in the repo can become
    # vulnerable at any time via a newly-disclosed CVE, not just when someone commits.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate and submit dependency graph
        # Same pinned commit as the setup-gradle step in android-build.yml -- see that
        # workflow's comment for why v5.x (MIT-licensed) rather than v6 (proprietary caching
        # component under separate commercial Terms of Use).
        uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
