name: Android CI

on:
  push:
    branches: [ "main" ]
    # Releases are cut by pushing a tag, never by merging. `vMAJOR.MINOR` publishes a stable
    # release, and the tag must equal `versionName`. Merging to main only builds and tests.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Least-privilege default: neither job needs more than this unless explicitly overridden below.
permissions:
  contents: read

jobs:
  # Runs on every push and PR (including from forks). Never touches GitHub Releases and never
  # sees release-signing secrets, so a compromised dependency or a malicious PR pulled in here
  # has nothing to exfiltrate beyond what `contents: read` already exposes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # Pinned to the last MIT-licensed v5.x release. gradle/actions v6 bundles a proprietary
        # caching component with its own commercial Terms of Use (see
        # https://blog.gradle.org/github-actions-for-gradle-v6) -- staying on v5 avoids opting
        # this repository into that without a deliberate decision to do so.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      # Without this, a failing test in CI shows only "there were failing tests" plus a path to
      # an HTML report on a runner that no longer exists. Uploading on failure keeps the actual
      # assertion output reachable. `if: failure()` so green runs don't pay the upload cost.
      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        # Dev/test builds only -- never published to Releases. See the `release` job for the
        # real, signed artifact users actually install.
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: paperscrape-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # ---------------------------------------------------------------------------------------------
  # The 18 instrumented tests -- 14 golden frames plus the DataStore corruption suite -- on a real
  # emulator. Added in v3.2; before it, the only safety net against a visual regression was
  # somebody remembering to run `connectedDebugAndroidTest` by hand, which is exactly the kind of
  # net that is not there when it is needed.
  #
  # **Deliberately not a gate on anything.** `continue-on-error` means a failure here marks the run
  # but blocks neither `build` nor `release`, and `release` does not list this job in its `needs`.
  # An emulator job is the flakiest thing in any Android CI, and a new one has no track record: it
  # has to earn the right to block a release by being observed green over real runs first. Promoting
  # it is a deliberate, separate change -- remove `continue-on-error`, then add `instrumented` to
  # `release.needs` -- and `ROADMAP.md` records that as the open question it is.
  #
  # It also does not run on pull requests. `connectedAndroidTest` on a fork's PR would spend ~15
  # minutes of runner time on code nobody has reviewed yet, for a signal the maintainer can get by
  # merging.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    continue-on-error: true
    # A stuck emulator is the normal failure mode, and the default 6-hour timeout would burn a
    # whole budget on one. Local runs of the same suite take well under a minute once the device is
    # up; the rest of this is AVD creation and boot.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Without KVM the emulator falls back to software rendering and takes long enough to hit the
      # timeout. GitHub's ubuntu runners have /dev/kvm but not the permissions for it; this is the
      # rule the emulator-runner action's own README prescribes.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # **Both APKs are built before the emulator exists, and that is the point.**
      #
      # Until v3.4 the emulator step's script was `./gradlew connectedDebugAndroidTest`, which
      # compiles the whole project *while the emulator is running*. That put an Android 17 guest --
      # which the emulator forces to at least 4 GB of RAM, whatever the AVD asks for; verified in
      # its own log, `Increasing RAM size to 4096MB`, even against an explicit `-memory 2048` --
      # next to a Gradle daemon, a Kotlin daemon and AGP's workers on a 16 GB runner, for the
      # several minutes a cold compile takes.
      #
      # Assembling first means the emulator is only alive for the install and the tests, which take
      # seconds. It does not make the build slower: the work is the same work, moved.
      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run instrumented tests
        # Pinned to a commit SHA like every other action here (AI_PROJECT_RULES.md 10.5).
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # **API 37 on purpose.** The committed goldens were rendered on Android 17, and the
          # per-pixel tolerance absorbs an anti-aliasing difference between Skia builds but is not
          # meant to absorb a whole platform version. `google_apis` rather than
          # `google_apis_playstore`: nothing under test needs Play services, and the plain image
          # boots faster and is the one the SDK publishes for every arch.
          #
          # **`'37.0'`, not `37`, and the quotes are load-bearing.** This input is not a number:
          # the action interpolates it verbatim into the SDK package identifiers, both
          # `platforms;android-<api-level>` and -- via `system-image-api-level`, which defaults to
          # this value -- `system-images;android-<api-level>;<target>;<arch>`. From Android 36.1
          # onwards the platform packages carry their minor version, so the SDK publishes
          # `platforms;android-36`, `android-36.1`, `android-37.0`, `android-37.1` and no bare
          # `android-37` at all. v3.2 passed `37`, `sdkmanager` answered
          # `Warning: Failed to find package 'platforms;android-37'` and exited 1, and the job died
          # before the emulator was ever started.
          #
          # The quotes stop YAML reading `37.0` as a float, which would risk it reaching the action
          # as the string "37" and putting the bug straight back.
          #
          # `platforms;android-37.0` and `build-tools;37.0.0` are already on the `ubuntu-latest`
          # image, so this install is a no-op for them and only the system image is fetched.
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # No window, no audio, no boot animation, no snapshot: a CI emulator that renders to a
          # host window is only slower. `-gpu swiftshader_indirect` is the software GL path, which
          # is what a headless runner has -- the Canvas goldens do not touch it, and the GL suite
          # (v3.2, P1-4) renders to its own offscreen pbuffer through the same driver.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          # **`sys.boot_completed` is not the same as "ready to install a package", and that gap is
          # the whole of the v3.4 bug.**
          #
          # The action starts this script the moment `sys.boot_completed` turns 1, while
          # `PackageManagerService`, `AppOpsService` and `UsageStatsService` are still coming up.
          # Until v3.3 the gap was covered by accident: the script's first act was a full Kotlin
          # compile, which took minutes. v3.3 fixed the SDK provisioning, CI reached this point for
          # the first time with a warm Gradle cache, Gradle asked for `pm install-create` seconds
          # after boot, and the framework answered from a half-initialised state -- appops returned
          # a non-default mode for `GET_USAGE_STATS`, `StorageStatsService` threw, and the run
          # reported `Starting 0 tests`.
          #
          # Reproduced locally on a freshly created API 37 AVD: the same 0-test failure, with
          # `DELETE_FAILED_INTERNAL_ERROR` instead -- a different service caught mid-initialisation,
          # the same race -- and the identical command a few seconds later ran 21/21 green.
          #
          # **The probe performs the transactions Gradle is about to perform.** A query like
          # `cmd package list packages` is not enough and was tried: it answered after 7 s on a
          # device that still could not complete an install or an uninstall. An install followed by
          # an uninstall exercises both halves of what `connectedDebugAndroidTest` does first, so
          # when it succeeds the thing that used to fail cannot. The loop is bounded and the
          # unguarded retry after it makes a genuinely broken device fail the job loudly, rather
          # than the job waiting out its 45-minute cap or going green having tested nothing.
          script: |
            set -e
            PKG=com.paperscrape.livewallpaper.debug
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb wait-for-device
            ready=0
            for i in $(seq 1 60); do
              if adb install -r -t "$APK" > /dev/null 2>&1 \
                 && adb uninstall "$PKG" > /dev/null 2>&1; then
                ready=1
                echo "package installer completed a full transaction after ~$((i * 2))s"
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::The package installer never became usable. Last attempt:"
              adb install -r -t "$APK" || true
              adb uninstall "$PKG" || true
              exit 1
            fi
            ./gradlew connectedDebugAndroidTest

      # The goldens write the rendered frame and a black/white diff next to it when one fails, and
      # those two images are the whole of the diagnosis. Without this they die with the runner and
      # the failure is a percentage with nothing to look at.
      - name: Upload instrumented test reports and rejected frames
        if: failure() || cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore

      # **So that the next failure is diagnosable instead of a stack trace with no context.**
      #
      # v3.3's failure was one `SecurityException` out of `pm install-create` and nothing else: no
      # device state, no free space, no package-service log, no versions. Everything below was
      # needed to investigate it and none of it existed, so the investigation had to be done by
      # reproducing the whole environment locally. `|| true` throughout: this step exists to
      # collect evidence about a failure that has already happened and must never become a second
      # failure of its own, nor mask the first.
      - name: Collect device diagnostics
        if: failure()
        run: |
          mkdir -p device-diagnostics
          {
            echo "=== emulator / sdk versions ==="
            "$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -2 || true
            adb version || true
            for p in emulator platform-tools "platforms/android-37.0" \
                     "system-images/android-37.0/google_apis/x86_64"; do
              echo "--- $p"; cat "$ANDROID_HOME/$p/source.properties" 2>/dev/null || true
            done
            echo "=== device ==="
            adb devices -l || true
            adb shell getprop ro.build.version.sdk || true
            adb shell getprop ro.build.version.release || true
            adb shell getprop ro.build.fingerprint || true
            adb shell getprop sys.boot_completed || true
            echo "=== memory / storage ==="
            adb shell cat /proc/meminfo || true
            adb shell df -h /data || true
            adb shell dumpsys diskstats || true
            echo "=== the services the failing install goes through ==="
            adb shell cmd appops get android GET_USAGE_STATS || true
            adb shell cmd package list packages || true
            echo "=== host ==="
            free -m || true
            df -h || true
          } > device-diagnostics/device-state.txt 2>&1
          adb logcat -d > device-diagnostics/logcat.txt 2>&1 || true

      - name: Upload device diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: device-diagnostics
          path: device-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

  # Only runs after `build` succeeds, and only for real pushes to main (never PRs, never forks --
  # the `if` below guards on the event/ref). This is the only place release-signing secrets are
  # ever exposed.
  # Only ever runs for a pushed tag. Merging to main no longer publishes anything -- shipping is
  # now a deliberate act (push a tag) rather than a side effect of merging.
  release:
    needs: build
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For actions/attest-build-provenance below: id-token mints the OIDC token used to request
      # a short-lived Sigstore signing certificate, attestations persists the resulting signed
      # attestation to GitHub's attestations API.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate the release tag against versionName
        # The tag is the release identifier and it must equal `versionName`.
        #
        #   vMAJOR.MINOR  ->  stable release, published as latest
        #
        # `versionName` is what a user sees and what a tag names; `versionCode` is Android's own
        # monotonic install counter and is deliberately *not* checked here. The two answer
        # different questions -- "which release is this" and "is this newer than what is
        # installed" -- and tying them together is what the previous rule got wrong: it required
        # `MAJOR == versionCode`, which made only integer tags expressible and forced the install
        # counter to carry release semantics it has no business carrying.
        #
        # No beta form is recognised yet. A tag that is not `vMAJOR.MINOR` fails, on purpose:
        # inventing a pre-release syntax before it is needed would mean guessing at it.
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $TAG is not a recognised release identifier. Use vMAJOR.MINOR, for example v1.1."
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName \"$VERSION_NAME\" in app/build.gradle.kts. The tag names the release, so the two must agree -- bump versionName (and versionCode) before tagging."
            exit 1
          fi

          KIND="stable"
          PRERELEASE="false"
          TITLE_SUFFIX="Stable"

          echo "Publishing $TAG as a $KIND release (prerelease=$PRERELEASE), versionName $VERSION_NAME, versionCode $VERSION_CODE."
          {
            echo "tag=$TAG"
            echo "kind=$KIND"
            echo "prerelease=$PRERELEASE"
            echo "title_suffix=$TITLE_SUFFIX"
          } >> "$GITHUB_OUTPUT"

      - name: Check release signing secrets are configured
        # Fail loudly and early with a clear message, rather than letting Gradle fall through to
        # an unsigned APK (see app/build.gradle.kts: release signingConfig is only attached when
        # PAPERSCRAPE_RELEASE_STORE_FILE is set) and produce a confusing failure several steps
        # later. See scripts/generate-release-keystore.sh to create these secrets.
        # OPENMETEO_API_KEY is intentionally NOT checked here -- it's optional (Open-Meteo's free
        # tier works with no key at all, see app/build.gradle.kts's own comment on
        # PAPERSCRAPE_OPENMETEO_API_KEY), so a release build without it just ships Live Weather
        # on the keyless endpoint rather than failing the whole build.
        run: |
          missing=()
          [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && missing+=("RELEASE_KEYSTORE_BASE64")
          [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ] && missing+=("RELEASE_STORE_PASSWORD")
          [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] && missing+=("RELEASE_KEY_ALIAS")
          [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ] && missing+=("RELEASE_KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing release signing secrets: ${missing[*]}. See scripts/generate-release-keystore.sh."
            exit 1
          fi

      - name: Decode release keystore
        # Written to a runner-local temp path that never touches the repository and is discarded
        # when the runner is torn down at the end of the job.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "PAPERSCRAPE_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          PAPERSCRAPE_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          PAPERSCRAPE_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PAPERSCRAPE_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Optional -- see app/build.gradle.kts's own comment. Leave the OPENMETEO_API_KEY
          # GitHub Secret unset entirely to ship without a baked-in key (Live Weather still works
          # via Open-Meteo's keyless free tier, or a user's own key entered in Settings).
          PAPERSCRAPE_OPENMETEO_API_KEY: ${{ secrets.OPENMETEO_API_KEY }}
        run: ./gradlew assembleRelease

      - name: Name the artefact after the release, and checksum it
        # Gradle always writes `app-release.apk`, so every release published one file with the
        # same name and nothing in it to say which version it was -- indistinguishable in a
        # downloads folder the moment there are two. Renamed to `PaperScrape-<tag>.apk`, with the
        # tag taken from the ref rather than written down anywhere: v2.8 and v3.0 will name
        # themselves.
        #
        # The checksum is generated *after* the rename and over the renamed file, so the name
        # inside the `.sha256` is the name of the thing you downloaded.
        run: |
          cd app/build/outputs/apk/release
          ARTIFACT="PaperScrape-${GITHUB_REF_NAME}.apk"
          mv app-release.apk "$ARTIFACT"
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          cat "$ARTIFACT.sha256"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
        id: artifact

      - name: Generate signed build provenance attestation
        # Goes beyond the plain SHA-256 above: this cryptographically binds the APK's exact
        # digest to *this specific* commit, workflow run, and repository via a Sigstore-signed,
        # publicly verifiable in-toto/SLSA attestation, published to GitHub's attestations API
        # (free for public repos). A checksum alone only proves "this file matches what I have a
        # hash for" -- it doesn't prove *who* produced it. Anyone can verify the download with:
        #   gh attestation verify PaperScrape-<tag>.apk --repo ${{ github.repository }}
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-path: app/build/outputs/apk/release/${{ steps.artifact.outputs.artifact }}

      - name: Refuse to overwrite an existing release
        # Git already refuses to push a duplicate tag, so reaching this with an existing release
        # means the tag and the release have drifted apart. Fail loudly rather than replacing a
        # published release as a side effect -- releases are immutable, stable and beta alike.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick the next unused identifier, or delete the existing release manually if this was intentional."
            exit 1
          fi

      - name: Compose release notes
        # Prefers a short, plain-language write-up at release-notes/<tag>.md (see
        # CONTRIBUTING.md's "Ship a new version" row) -- this is what actually shows up on the
        # GitHub release page AND inside the app's own update dialog (UpdateChecker reads this
        # same release body), so it needs to read like "what's new for you", not a commit log.
        # Falls back to a generic message if that file wasn't added for this version, and always
        # appends a short, secondary technical footer for anyone who wants to verify the build.
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KIND: ${{ steps.tag.outputs.kind }}
        run: |
          NOTES_FILE="release-notes/${TAG}.md"
          COMPOSED="${RUNNER_TEMP}/release-notes.md"
          : > "$COMPOSED"
          # No tag currently classifies as a beta -- the tag step only recognises stable
          # vMAJOR.MINOR. Kept so that adding a beta form later needs no change here.
          if [ "$KIND" = "beta" ]; then
            {
              echo "> **Beta / pre-release.** Built from the same signing key as the stable"
              echo "> releases, so it installs over one and can be replaced by one, but it has not"
              echo "> had the testing a stable release gets."
              echo ""
            } >> "$COMPOSED"
          fi
          if [ -f "$NOTES_FILE" ]; then
            cat "$NOTES_FILE" >> "$COMPOSED"
          else
            echo "New PaperScrape build. See the commit history for details." >> "$COMPOSED"
          fi
          {
            echo ""
            echo "---"
            echo "🔒 Verify this build: check \`${{ steps.artifact.outputs.artifact }}.sha256\`, or run \`gh attestation verify ${{ steps.artifact.outputs.artifact }} --repo ${{ github.repository }}\`."
          } >> "$COMPOSED"
          echo "file=$COMPOSED" >> "$GITHUB_OUTPUT"

      - name: Publish release
        # Every release is currently stable and published as latest, so anything reading
        # /releases/latest -- including anyone linking to it -- always sees the newest build. The
        # prerelease branch below is kept rather than deleted: when a beta form is added to the
        # tag step it will set prerelease=true and this needs no further change, and a
        # pre-release must be signed with the same release key as a stable build or it could not
        # be installed over one.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          TITLE_SUFFIX: ${{ steps.tag.outputs.title_suffix }}
        run: |
          EXTRA_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease --latest=false)
          else
            EXTRA_ARGS+=(--latest=true)
          fi
          gh release create "$TAG" \
            "app/build/outputs/apk/release/${{ steps.artifact.outputs.artifact }}" \
            "app/build/outputs/apk/release/${{ steps.artifact.outputs.artifact }}.sha256" \
            --title "PaperScrape $TAG — $TITLE_SUFFIX" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --target "${{ github.sha }}" \
            "${EXTRA_ARGS[@]}"
