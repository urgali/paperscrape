name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Least-privilege default: this workflow only needs to read the repository.
# The one job that also creates a GitHub Release overrides this with its own
# job-level `permissions: contents: write`, scoped to just that job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Needs write access to create a GitHub Release and upload the APK to it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # NOTE: not yet SHA-pinned -- could not resolve a verified full commit SHA for the
        # current v5 tag of this action. See CHANGELOG "outstanding" notes.
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Gradle wrapper (if not committed)
        # NOTE: still required -- gradlew/gradlew.bat/gradle-wrapper.jar are not committed to
        # this repo (no network access was available to fetch/verify a real wrapper jar when
        # this project was generated). See CHANGELOG "outstanding" notes.
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: paperscrape-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Releases
        # Only for real pushes to main (not PRs, not forks) -- every successful build gets its
        # own release, tagged by run number, containing only the APK file.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            --title "Build #${{ github.run_number }}" \
            --notes "Automated debug APK build from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
