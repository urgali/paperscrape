name: Android CI

on:
  push:
    branches: [ "main" ]
    # Releases are cut by pushing a tag, never by merging. `vMAJOR.MINOR` publishes a stable
    # release, and the tag must equal `versionName`. Merging to main only builds and tests.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Least-privilege default: neither job needs more than this unless explicitly overridden below.
permissions:
  contents: read

jobs:
  # Runs on every push and PR (including from forks). Never touches GitHub Releases and never
  # sees release-signing secrets, so a compromised dependency or a malicious PR pulled in here
  # has nothing to exfiltrate beyond what `contents: read` already exposes.
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout talks to git, so the job token is not left in .git/config
          # where the build's plugins and dependencies could read it.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # Pinned to the last MIT-licensed v5.x release. gradle/actions v6 bundles a proprietary
        # caching component with its own commercial Terms of Use (see
        # https://blog.gradle.org/github-actions-for-gradle-v6) -- staying on v5 avoids opting
        # this repository into that without a deliberate decision to do so.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      # Without this, a failing test in CI shows only "there were failing tests" plus a path to
      # an HTML report on a runner that no longer exists. Uploading on failure keeps the actual
      # assertion output reachable. `if: failure()` so green runs don't pay the upload cost.
      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        # Dev/test builds only -- never published to Releases. See the `release` job for the
        # real, signed artifact users actually install.
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: paperscrape-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # Only runs after `build` succeeds, and only for a pushed tag (never PRs, never forks -- the `if`
  # below guards on the event and the ref). This is the only place release-signing secrets are
  # ever exposed. Merging to main publishes nothing -- shipping is a deliberate act (push a tag)
  # rather than a side effect of merging.
  release:
    needs: build
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For actions/attest-build-provenance below: id-token mints the OIDC token used to request
      # a short-lived Sigstore signing certificate, attestations persists the resulting signed
      # attestation to GitHub's attestations API.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token this job holds can write releases, and the signed build runs every plugin and
          # dependency of the project: it is not left in .git/config for them. The steps that talk
          # to GitHub (`gh`) take it from their own `env`, not from git.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate the release tag against versionName
        # The tag is the release identifier and it must equal `versionName`.
        #
        #   vMAJOR.MINOR  ->  stable release, published as latest
        #
        # `versionName` is what a user sees and what a tag names; `versionCode` is Android's own
        # monotonic install counter and is deliberately *not* checked here. The two answer
        # different questions -- "which release is this" and "is this newer than what is
        # installed" -- and tying them together, by requiring `MAJOR == versionCode`, would make
        # only integer tags expressible and force the install counter to carry release semantics
        # it has no business carrying.
        #
        # No beta form is recognised. A tag that is not `vMAJOR.MINOR` fails, on purpose:
        # inventing a pre-release syntax before it is needed would mean guessing at it.
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $TAG is not a recognised release identifier. Use vMAJOR.MINOR, for example v1.1."
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName \"$VERSION_NAME\" in app/build.gradle.kts. The tag names the release, so the two must agree -- bump versionName (and versionCode) before tagging."
            exit 1
          fi

          KIND="stable"
          PRERELEASE="false"
          TITLE_SUFFIX="Stable"

          echo "Publishing $TAG as a $KIND release (prerelease=$PRERELEASE), versionName $VERSION_NAME, versionCode $VERSION_CODE."
          {
            echo "tag=$TAG"
            echo "kind=$KIND"
            echo "prerelease=$PRERELEASE"
            echo "title_suffix=$TITLE_SUFFIX"
          } >> "$GITHUB_OUTPUT"

      - name: Check the release note exists
        # `release-notes/<tag>.md` becomes the release body and the text of the in-app update
        # dialog, and a published release body cannot be changed. A tag without its note -- or with
        # a note under another name, `release-notes/5.18.md` for `v5.18` -- fails here, before the
        # signed build, rather than publishing a release that says nothing about itself.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          NOTES_FILE="release-notes/${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::$NOTES_FILE is missing. Every release needs its note under the tag's exact name; add it and tag again."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "::error::$NOTES_FILE is empty. Write the note before tagging."
            exit 1
          fi
          echo "Release note: $NOTES_FILE"

      - name: Refuse to overwrite an existing release
        # Git already refuses to push a duplicate tag, so reaching this with an existing release
        # means the tag and the release have drifted apart. Fail loudly rather than replacing a
        # published release as a side effect -- releases are immutable, stable and beta alike.
        # Checked before the signed build and the attestation, which cost minutes and publish a
        # permanent provenance record for the APK they build.
        #
        # One request, for the published release under the tag, and its HTTP status decides:
        # `gh api --include` prints the status line first whatever the answer. gh exiting 0 is a
        # release that exists, and stops the job; exit 1 with a 404 is no release, and alone lets the
        # job go on. Any other failure (the network, the token, GitHub itself) says nothing about
        # whether the release exists, so it stops the job here as well, with gh's own message. The
        # endpoint answers for published releases only: a draft under the tag is not looked for.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ERRORS=$(mktemp)
          STATUS=0
          HEADERS=$(gh api --include --silent "repos/$REPOSITORY/releases/tags/$TAG" 2>"$ERRORS") || STATUS=$?
          HTTP_STATUS=$(awk 'NR == 1 && $1 ~ /^HTTP\// { print $2 }' <<< "$HEADERS")
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::Release $TAG already exists. Pick the next unused identifier, or delete the existing release manually if this was intentional."
            exit 1
          fi
          if [ "$STATUS" -ne 1 ] || [ "$HTTP_STATUS" != "404" ]; then
            echo "::error::Could not tell whether release $TAG already exists (gh api exited $STATUS, HTTP status ${HTTP_STATUS:-none}), so nothing is built. Put right what gh says below and run the job again."
            cat "$ERRORS"
            exit 1
          fi
          echo "No release $TAG yet."

      - name: Check release signing secrets are configured
        # Fail loudly and early with a clear message, rather than letting Gradle fall through to
        # an unsigned APK (see app/build.gradle.kts: release signingConfig is only attached when
        # PAPERSCRAPE_RELEASE_STORE_FILE is set) and produce a confusing failure several steps
        # later. See scripts/generate-release-keystore.sh to create these secrets.
        # There is no weather key to check for, because none is baked into the APK: a
        # `buildConfigField` String is a plain constant in the dex, so a key put there is
        # readable in every published release with `strings`. Live Weather runs
        # on Open-Meteo's keyless free tier, and a user's own key from Settings upgrades to
        # the higher-limit endpoint. No workflow reads a secret named `OPENMETEO_API_KEY`, and
        # `ShippedApkContractTest` fails the build if `PAPERSCRAPE_OPENMETEO_API_KEY` is
        # injected or any `buildConfigField` is read from the environment: one left in the
        # repository's settings changes no build, and removing it is harmless.
        #
        # The secrets reach the script as environment variables, never pasted into its text: a
        # `${{ secrets.X }}` inside `run:` is substituted before bash reads the script, so a password
        # holding a `"` or a backtick would break the script or run part of itself.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing+=("RELEASE_KEYSTORE_BASE64")
          [ -z "$RELEASE_STORE_PASSWORD" ] && missing+=("RELEASE_STORE_PASSWORD")
          [ -z "$RELEASE_KEY_ALIAS" ] && missing+=("RELEASE_KEY_ALIAS")
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing+=("RELEASE_KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing release signing secrets: ${missing[*]}. See scripts/generate-release-keystore.sh."
            exit 1
          fi

      - name: Decode release keystore
        # Written to a runner-local temp path that never touches the repository and is discarded
        # when the runner is torn down at the end of the job.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "PAPERSCRAPE_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          PAPERSCRAPE_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          PAPERSCRAPE_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PAPERSCRAPE_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # The signing secrets are the only secrets this build takes, and they stay on the runner:
          # they sign the APK, they do not go inside it. A PAPERSCRAPE_OPENMETEO_API_KEY passed
          # here would end up as a readable string in the shipped dex -- see the step above.
        run: ./gradlew assembleRelease

      - name: Name the artefact after the release, and checksum it
        # Gradle always writes `app-release.apk`, so every release would publish one file with the
        # same name and nothing in it to say which version it is -- indistinguishable in a
        # downloads folder the moment there are two. Renamed to `PaperScrape-<tag>.apk`, with the
        # tag taken from the ref rather than written down anywhere, so every release names itself.
        #
        # The checksum is generated *after* the rename and over the renamed file, so the name
        # inside the `.sha256` is the name of the thing you downloaded.
        run: |
          cd app/build/outputs/apk/release
          ARTIFACT="PaperScrape-${GITHUB_REF_NAME}.apk"
          mv app-release.apk "$ARTIFACT"
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          cat "$ARTIFACT.sha256"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
        id: artifact

      - name: Generate signed build provenance attestation
        # Goes beyond the plain SHA-256 above: this cryptographically binds the APK's exact
        # digest to *this specific* commit, workflow run, and repository via a Sigstore-signed,
        # publicly verifiable in-toto/SLSA attestation, published to GitHub's attestations API
        # (free for public repos). A checksum alone only proves "this file matches what I have a
        # hash for" -- it doesn't prove *who* produced it. Anyone can verify the download with:
        #   gh attestation verify PaperScrape-<tag>.apk --repo ${{ github.repository }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/build/outputs/apk/release/${{ steps.artifact.outputs.artifact }}

      - name: Compose release notes
        # The body is the short, plain-language write-up at release-notes/<tag>.md, one file per tag
        # -- this is what actually shows up on the
        # GitHub release page AND inside the app's own update dialog (UpdateChecker reads this
        # same release body), so it needs to read like "what's new for you", not a commit log.
        # "Check the release note exists" refuses the tag before the build when the file is missing
        # or empty, so there is no generic text to fall back on. A short, secondary technical footer
        # follows it for anyone who wants to verify the build.
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KIND: ${{ steps.tag.outputs.kind }}
        run: |
          NOTES_FILE="release-notes/${TAG}.md"
          COMPOSED="${RUNNER_TEMP}/release-notes.md"
          : > "$COMPOSED"
          # No tag classifies as a beta -- the tag step recognises only stable
          # vMAJOR.MINOR. The branch is here so that a beta form added there needs no change here.
          if [ "$KIND" = "beta" ]; then
            {
              echo "> **Beta / pre-release.** Built from the same signing key as the stable"
              echo "> releases, so it installs over one and can be replaced by one, but it has not"
              echo "> had the testing a stable release gets."
              echo ""
            } >> "$COMPOSED"
          fi
          cat "$NOTES_FILE" >> "$COMPOSED"
          {
            echo ""
            echo "---"
            echo "🔒 Verify this build: check \`${{ steps.artifact.outputs.artifact }}.sha256\`, or run \`gh attestation verify ${{ steps.artifact.outputs.artifact }} --repo ${{ github.repository }}\`."
          } >> "$COMPOSED"
          echo "file=$COMPOSED" >> "$GITHUB_OUTPUT"

      - name: Publish release
        # Every release is stable and published as latest, so anything reading
        # /releases/latest -- including anyone linking to it -- always sees the newest build. The
        # prerelease branch below stays: a beta form added to the tag step would set
        # prerelease=true and this would need no further change, and a
        # pre-release must be signed with the same release key as a stable build or it could not
        # be installed over one.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          TITLE_SUFFIX: ${{ steps.tag.outputs.title_suffix }}
        run: |
          EXTRA_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease --latest=false)
          else
            EXTRA_ARGS+=(--latest=true)
          fi
          gh release create "$TAG" \
            "app/build/outputs/apk/release/${{ steps.artifact.outputs.artifact }}" \
            "app/build/outputs/apk/release/${{ steps.artifact.outputs.artifact }}.sha256" \
            --title "PaperScrape $TAG — $TITLE_SUFFIX" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --target "${{ github.sha }}" \
            "${EXTRA_ARGS[@]}"
