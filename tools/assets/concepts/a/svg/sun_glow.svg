<svg xmlns="http://www.w3.org/2000/svg" width="396" height="396" viewBox="0 0 396 396">
  <!--
    Concept A "Layers" - v4.23 phase 1. The most direct answer to the
    maintainer's note: the rays are gone. Only the radial halo is left, which
    DESIGN_NOTES explicitly sanctions for the sun's glow; the ambience
    around the disc is already given by the renderer's drawRadialGlow. The same
    396x396 canvas and the same origin (-198) as the shipped sprite.
  -->
  <defs>
    <radialGradient id="g_sunglow_a">
      <stop offset="0"    stop-color="#F7CE64" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#F0A03C" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#F0A03C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="198" cy="198" r="198" fill="url(#g_sunglow_a)"/>
</svg>
