<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!--
    Concept A "Layers" - v4.23 phase 1. Two overlapping papers: underneath, a
    four-pointed sparkle rotated by 45 degrees in a darker cream; on top,
    the main sparkle in the same cream as the renderer's star points
    (#FBF4E6), with a small, almost white heart. At the real size
    (10-16 px) the paper underneath reads as a soft halo, not as
    eight points. SCENE_UNITS like the shipped sprite, the same 180 canvas.
  -->
  <polygon points="90,34 103,77 146,90 103,103 90,146 77,103 34,90 77,77"
           transform="rotate(45 90 90)" fill="#EBDDBB"/>
  <polygon points="90,3 103.5,76.5 177,90 103.5,103.5 90,177 76.5,103.5 3,90 76.5,76.5"
           fill="#FBF4E6"/>
  <polygon points="90,62 97,83 118,90 97,97 90,118 83,97 62,90 83,83" fill="#FFFDF4"/>
</svg>
