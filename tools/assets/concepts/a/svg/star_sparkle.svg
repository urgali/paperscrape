<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!--
    Concept A "Strati" - v4.23 fase 1. Due carte sovrapposte: sotto una
    scintilla a quattro punte ruotata di 45 gradi in crema piu' scuro, sopra
    la scintilla principale nello stesso crema dei punti-stella del renderer
    (#FBF4E6), con un cuore piccolo quasi bianco. Alla dimensione vera
    (10-16 px) la carta di sotto si legge come un alone morbido, non come
    otto punte. SCENE_UNITS come lo sprite spedito, stessa tela 180.
  -->
  <polygon points="90,34 103,77 146,90 103,103 90,146 77,103 34,90 77,77"
           transform="rotate(45 90 90)" fill="#EBDDBB"/>
  <polygon points="90,3 103.5,76.5 177,90 103.5,103.5 90,177 76.5,103.5 3,90 76.5,76.5"
           fill="#FBF4E6"/>
  <polygon points="90,62 97,83 118,90 97,97 90,118 83,97 62,90 83,83" fill="#FFFDF4"/>
</svg>
