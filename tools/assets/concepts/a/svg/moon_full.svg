<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    Concept A "Layers" - v4.23 phase 1. Tintable mask in four tones of
    grey, the same ratios as the Oak's crown: base #DCDCDC
    (the mottling floor, 13.7%), bands progressively lighter shifted to the
    upper left, a white top. The craters are small discs in the base tone
    laid over the light bands: in the shipped sprite they were 4 levels from the
    disc (#fbfbfb on #ffffff) and were invisible; here they are 20-27 levels away
    and they read. Mean of the opaque pixels well above 220 (the light disc dominates).
  -->
  <circle cx="120" cy="120" r="102" fill="#DCDCDC"/>
  <circle cx="116" cy="116" r="88"  fill="#ECECEC"/>
  <circle cx="112" cy="112" r="72"  fill="#F7F7F7"/>
  <circle cx="102" cy="103" r="36"  fill="#FFFFFF"/>
  <circle cx="90"  cy="86"  r="15"  fill="#E3E3E3"/>
  <circle cx="144" cy="138" r="19"  fill="#DFDFDF"/>
  <circle cx="94"  cy="148" r="10"  fill="#E3E3E3"/>
</svg>
