<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    Concept A "Layers" - v4.23 phase 1. The layered half moon, with the
    same rule as the crescent: the bands share the horns and the limb
    (A102) and differ only in the terminator's arc - straight for the
    base, rx 36 and 72 for the light bands towards the limb. One crater in the
    middle tone. Tintable mask, four tones of the Oak's family.
  -->
  <path d="M120 18 A102 102 0 1 1 120 222 L120 18 Z" fill="#DCDCDC"/>
  <path d="M120 18 A102 102 0 1 1 120 222 A36 102 0 0 0 120 18 Z" fill="#EEEEEE"/>
  <path d="M120 18 A102 102 0 1 1 120 222 A72 102 0 0 0 120 18 Z" fill="#FAFAFA"/>
  <circle cx="193" cy="105" r="12" fill="#E3E3E3"/>
  <circle cx="172" cy="163" r="8"  fill="#E7E7E7"/>
</svg>
