<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    Concept C "Fretwork" - v4.23 phase 1. Tintable mask in ONE tone: a white
    disc r=102 with the craters CUT THROUGH (the sky passes through: tint the
    moon any colour, the craters stay sky) and a thin arc-shaped
    slit cut parallel to the limb at the lower right, which
    suggests the sphere by the absence of paper alone. The holes are small and
    grouped off centre, at the upper left, with one near the lower
    limb: it is a moon, not a bowling ball. Zero mottling.
  -->
