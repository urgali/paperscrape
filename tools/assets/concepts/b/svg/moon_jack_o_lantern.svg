<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    Giro 1d - concept B, la zucca RIFATTA DA CAPO. Conservato il DISPOSITIVO,
    non il disegno: e' l'unica luna coi fori passanti e a ~100 px deve dire
    "Halloween" a colpo d'occhio. Tutto il resto e' nuovo, nel linguaggio di
    B: bordo tagliato a mano (40 vertici, +/-2.2) e FORI TAGLIATI A MANO -
    due occhi a cuneo asimmetrici inclinati verso il naso, un naso a
    triangolo storto, una bocca larga unica con quattro zanne che scendono
    dal labbro superiore, tutti poligoni con tremolio +/-1.4-1.6. NESSUNA
    coordinata viene dalla faccia spedita (li' occhi 48,78/99,108/..., bocca a
    curve C con denti come fori separati; qui numeri e forme diverse, un solo
    foro per la bocca). I fori sono grandi apposta: a 158 px di disco gli
    occhi sono ~30x20 px e la bocca ~100x38 px, leggibili a colpo d'occhio.
    NIENTE anello esterno, per scelta: la zucca spedita usava l'anello per
    dare profondita' a un disco a compasso; qui il bordo tagliato e i fori
    irregolari portano l'identita' da soli, e B e' "un foglio, un taglio" -
    un secondo foglio attorno sarebbe la terza generazione nello stesso
    sprite. Maschera tintabile, un tono #F4F4F4.
  -->
