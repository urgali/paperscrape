<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    Round 1d - concept B, the pumpkin REDONE FROM SCRATCH. The DEVICE is kept,
    not the drawing: it is the only moon with holes cut through, and at ~100 px it must say
    "Halloween" at a glance. Everything else is new, in the language of
    B: an edge cut by hand (40 vertices, +/-2.2) and HOLES CUT BY HAND -
    two asymmetric wedge eyes slanting towards the nose, a nose like a
    crooked triangle, one wide mouth with four fangs coming down
    from the upper lip, all polygons with a +/-1.4-1.6 wobble. NOT ONE
    coordinate comes from the shipped face (there: eyes 48,78/99,108/..., a mouth of
    C curves with the teeth as separate holes; here different numbers and shapes, a single
    hole for the mouth). The holes are large on purpose: on a 158 px disc the
    eyes are ~30x20 px and the mouth ~100x38 px, readable at a glance.
    NO outer ring, by choice: the shipped pumpkin used the ring to
    give depth to a compass-struck disc; here the cut edge and the irregular
    holes carry the identity on their own, and B is "one sheet, one cut" -
    a second sheet around it would be a third generation in the same
    sprite. Tintable mask, one tone #F4F4F4.
  -->
