<svg xmlns="http://www.w3.org/2000/svg" width="396" height="396" viewBox="0 0 396 396">
  <!--
    Giro 1c, CORONA ATTACCATA "smerli_bassi" - concept B. Una corona smerlata che
    ESCE dal bordo del disco, ritagliata senza stacco: 16 lobi arrotondati
    (seno su ogni lobo, 14 campioni), tremolio a mano +/-2.0 sul bordo.
    GEOMETRIA DERIVATA, non inventata: nel sun_glow spedito i raggi partono a
    r=110.6-115.0 con disco r=102, e il vuoto di 9-13 unita' lo copre il
    gradiente; B non ha gradiente e il disco di B e' un taglio a mano fra
    r=96.6 e 101.4, quindi la corona ha la BASE a 94 (sotto il minimo del
    disco: nessun cielo puo' passare fra i due, il disco disegnato sopra copre
    la cucitura) e le VALLI a 104 (sopra il massimo del disco: il fondo di
    ogni smerlo resta visibile tutto attorno). Picchi a 132: la SOLA cosa
    che cambia fra le due varianti e' questa profondita'.
    Colore: il giallo del cuore del sole (#F7CE64) a carta OPACA - un secondo
    foglio sotto il disco, cosi' il bordo tagliato del disco (scelto dal
    maintainer) resta leggibile e l'ombra del disco cade sulla corona come
    deve. NIENTE gradiente (nel giro 1b su cielo pulito leggeva come
    sbavatura). OMBRA SI', la stessa del disco (+6,+8, nero 13%): la corona e'
    carta di B e la sua ombra e' quella che rende l'unione disco+corona un
    unico ritaglio con un'unica ombra.
  -->
