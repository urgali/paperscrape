  <!--
    Phase 2 / Part A - concept B, the pumpkin's PUSHED variant. The same edge as round 1d,
    the same nose, the same constraint (round, one sheet, holes cut through only). Three pushes,
    all INSIDE the disc:
    1. EYES - the wedge, with a steeper brow (the inner vertex drops to
       y 111 instead of 106) and a higher outer tail: the gaze narrows, mean.
    2. MOUTH - the carved pumpkin's saw-toothed grin: a single hole, wider
       (38..202) and taller, with three fangs from the upper lip and two from the
       lower lip, staggered, corners rising. 1d had fangs at the top only.
    3. RIBS - four tapered grooves (6 -> 2.5 units) cut into the
       high crown of the disc, where the face does not reach, following the meridians of
       a pumpkin: they are the one thing the constraint leaves open, and they turn the
       disc into a pumpkin without touching the silhouette. Cut through like everything else.
    Tintable mask, one tone #F4F4F4.
  -->
