  <!--
    Fase 2 / Parte A - concept B, zucca variante SPINTA. Stesso bordo del giro 1d,
    stesso naso, stesso vincolo (tonda, un foglio, solo fori passanti). Tre spinte,
    tutte DENTRO il disco:
    1. OCCHI - il cuneo, con sopracciglio piu' ripido (il vertice interno scende a
       y 111 invece di 106) e coda esterna piu' alta: lo sguardo si chiude, cattivo.
    2. BOCCA - il ghigno a sega della zucca intagliata: un foro solo, piu' largo
       (38..202) e piu' alto, con tre zanne dal labbro superiore e due dal labbro
       inferiore sfalsate, angoli che salgono. Il 1d aveva zanne solo in alto.
    3. COSTOLATURE - quattro solchi affusolati (6 -> 2.5 unita') ritagliati nella
       corona alta del disco, dove la faccia non arriva, che seguono i meridiani di
       una zucca: sono l'unica cosa che il vincolo lascia aperta e trasformano il
       disco in una zucca senza toccare la silhouette. Passanti come tutto il resto.
    Maschera tintabile, un tono #F4F4F4.
  -->
