  <!--
    Giro 1b, variante ALONE V1 "Anello di carta" - concept B. La richiesta del
    maintainer ("un unico cerchio intorno al sole") eseguita nel linguaggio di
    B e in niente altro: UN anello di carta pieno, bordi tagliati a mano
    (30 vertici, tremolio +/-2.4 su entrambi i bordi, evenodd), r 150-176,
    dentro l'anello 150..198 documentato al sito di chiamata. NIENTE
    gradiente: la variante che prova se l'alone morbido serve ancora quando
    c'e' l'anello. Niente ombra: su una corona di 26 unita' l'ombra a +6+8
    sarebbe un filo scuro ambiguo, e il sole ce l'ha gia' (scelta scritta,
    vedi report). Un tono, opacita' 0.62.
    RISCHIO DICHIARATO: a scena il tremolio vale ~1.6 px; e un anello pieno
    senza tratteggio CONVERGE sulla silhouette dell'anello del concept C
    (li' 24 trattini, qui pieno) - detto nel report, non nascosto.
