<svg xmlns="http://www.w3.org/2000/svg" width="240" height="366" viewBox="2 0 80 122">
  <!--
    Proposal C, the fir: squat and broad like the oak it stands beside. Three full,
    low tiers, cut almost straight but each with its own small tilt,
    like paper cut freehand and stacked. A blunted apex with a star on the tip.
    122 units, fixed art, the trunk in the family's browns.

    The star is the same four-pointed one as proposals A and B, widened to the
    proportions of this body: half-diagonals 6.5 x 7.5 against A's 6 x 6,
    because the squat fir is 84 units wide against A's 78, and a star at
    A's size would read smaller on it. It sinks 5 units into the top tier,
    exactly as in A, so the snow settles around its base.
  -->
  <!-- squat trunk -->
  <path d="M 37,122 C 38,119 38.6,114 38.8,106 L 45.2,106 C 45.4,114 46,119 47,122 Z" fill="#533217"/>
  <!-- low tier: rim tilted slightly to the right -->
  <path d="M 42,58
           C 33,72 20,84 6,91
           C 3.4,92.3 2,94.4 2,96.6
           L 82,99.4
           C 82.2,97.2 80.9,95 78.4,93.6
           C 64.4,85.8 51,73 42,58 Z" fill="#3A7044"/>
  <!-- middle tier: tilted the other way -->
  <path d="M 42,32
           C 35.5,44 26,55 15.5,61.5
           C 13.2,62.9 12,64.9 12.1,66.9
           L 72.5,64.5
           C 72.3,62.5 71,60.7 68.7,59.5
           C 58.2,54 48.5,44 42,32 Z" fill="#2E5E38"/>
  <!-- top tier, blunted apex -->
  <path d="M 42,10
           C 38,18.5 32.5,26.5 26.5,31.5
           C 24.7,33 23.9,34.8 24.1,36.5
           L 60.5,38.2
           C 60.6,36.4 59.7,34.6 57.8,33.2
           C 51.8,28.5 46,19.5 42,10 Z" fill="#3A7044"/>
  <!-- star on the tip -->
  <path d="M 42,0 L 44.4,5.1 L 48.5,7.5 L 44.4,9.9 L 42,15 L 39.6,9.9 L 35.5,7.5 L 39.6,5.1 Z" fill="#F2C24A"/>
</svg>
