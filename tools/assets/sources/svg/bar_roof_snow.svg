<svg xmlns="http://www.w3.org/2000/svg" width="300" height="18" viewBox="0 2 100 6">
<!--
  Snow for the piers: a mound on each corner pier and a drift bedded on the name plate between
  them. An earlier draft spanned the whole gap between the piers and floated over the air on
  either side of the plate; snow lies on things, so each piece now sits on a thing. Blitted at
  (-50,-110.5): mounds capping the piers at -108, the drift riding the plate at -105.
-->
  
