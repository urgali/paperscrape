<svg xmlns="http://www.w3.org/2000/svg" width="108" height="21" viewBox="0 0 36 7">
  <!--
    One small heap of fallen leaves, in the same four autumn tones drawFallingLeaves uses, so a
    heap on the ground and a leaf still in the air are the same leaves.

    Fixed art and one canvas per heap, exactly like snow_pile and ground_flowers. The lobes reach
    both canvas edges and stand on y=7, so the blit origin puts the heap on the ground line and
    there is no padding to normalise away.
  -->
<ellipse cx="9" cy="7" rx="9" ry="4" fill="#B5451B"></ellipse>
        <ellipse cx="27" cy="7" rx="9" ry="3.4" fill="#8F3B1B"></ellipse>
        <ellipse cx="18" cy="7" rx="8" ry="7" fill="#D2691E"></ellipse>
        <ellipse cx="13" cy="4.5" rx="3.2" ry="2" fill="#E0A93A"></ellipse>
        <ellipse cx="24" cy="5" rx="2.8" ry="1.8" fill="#E0A93A"></ellipse>
</svg>
