<svg xmlns="http://www.w3.org/2000/svg" width="303" height="198" viewBox="2 0 101 66">
  <!--
    v4.21, the "Broad Oak": a cushion of foliage wider than it is tall, a
    scalloped rim, layered in three horizontal bands of paper - dark below, light
    above - plus the full light on the top. It replaces the octagon on a straight trunk
    that the maintainer read as a lollipop.

    Tintable mask: greys only, the lightest #ffffff, the darkest #dcdcdc
    (13.9% mottling, under the 14% ceiling).

    The canvas is trimmed to the content: 101x66 units (303x198 px on the 3x grid),
    viewBox moved to x=2 because the drawing starts there. Blitted at (-50,-80) in
    drawTree's raised space, that is object x -50..51, y -118..-52: the belly
    of the cushion covers the arms of the trunk's fork, which reach -60/-62,
    with 8 units of overlap - more than the most that the +/-4 degree sway
    can open.
  -->
  <!-- low band: the full silhouette, the darkest tone -->
  <g fill="#dcdcdc">
    <circle cx="16" cy="46" r="14"/>
    <circle cx="34" cy="50" r="15"/>
    <circle cx="53" cy="51" r="15"/>
    <circle cx="72" cy="49" r="15"/>
    <circle cx="90" cy="44" r="13"/>
    <circle cx="24" cy="32" r="16"/>
    <circle cx="45" cy="28" r="18"/>
    <circle cx="67" cy="29" r="17"/>
    <circle cx="86" cy="32" r="14"/>
    <circle cx="35" cy="16" r="14"/>
    <circle cx="55" cy="13" r="13"/>
    <circle cx="72" cy="17" r="12"/>
  </g>
  <!-- middle band -->
  <g fill="#ececec">
    <circle cx="17" cy="42.5" r="12.5"/>
    <circle cx="34" cy="46" r="13.5"/>
    <circle cx="53" cy="47" r="13.5"/>
    <circle cx="71" cy="45" r="13.5"/>
    <circle cx="88" cy="40.5" r="11.5"/>
    <circle cx="24" cy="29.5" r="14.5"/>
    <circle cx="45" cy="25.5" r="16.5"/>
    <circle cx="66" cy="26.5" r="15.5"/>
    <circle cx="84" cy="29.5" r="12.5"/>
    <circle cx="34.5" cy="14.5" r="12.5"/>
    <circle cx="54.5" cy="11.5" r="11.5"/>
    <circle cx="70.5" cy="15.5" r="10.5"/>
  </g>
  <!-- high band: the light on the cushion's shoulders -->
  <g fill="#f7f7f7">
    <circle cx="26" cy="26" r="11"/>
    <circle cx="44" cy="21.5" r="13"/>
    <circle cx="63" cy="22.5" r="12"/>
    <circle cx="80" cy="26" r="9"/>
    <circle cx="34" cy="12.5" r="10"/>
    <circle cx="53" cy="9.5" r="9.5"/>
    <circle cx="69" cy="13.5" r="8.5"/>
  </g>
  <!-- the full light on the top, off centre to the left -->
  <g fill="#ffffff">
    <circle cx="38" cy="10.5" r="7"/>
    <circle cx="50" cy="7.8" r="6.5"/>
    <circle cx="30" cy="17" r="6"/>
  </g>
  <!-- inner tufts of shadow on the lower flank -->
  <g fill="#e3e3e3">
    <circle cx="44" cy="54" r="6"/>
    <circle cx="76" cy="52" r="5.5"/>
    <circle cx="20" cy="52" r="5"/>
    <circle cx="92" cy="38" r="5"/>
  </g>
</svg>
