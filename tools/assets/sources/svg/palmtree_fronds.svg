<svg xmlns="http://www.w3.org/2000/svg" width="168" height="144" viewBox="0 0 56 48">
  <!--
    The coconut palm's living crown: seven broad lens-shaped blades that arch up from one point
    and fall again, each one card with a lighter fold along its back, and three coconuts hanging
    underneath.

    **The attachment point is declared, not measured.** The blades converge at (84, 78) px -
    (28, 26) in local units - and that is the point `drawPalmTree` lays two units below the top
    of the trunk so the crown covers the trunk rather than balancing on it. The margin around it
    is load-bearing: this canvas is sized for the blades that fall *below* the convergence, which
    is the thing that makes a palm a palm and the thing the old 40x40 canvas had no room for.

    **Its two alternatives share this canvas and this origin.** `palmtree_fronds_dead` (Halloween)
    and `palmtree_fronds_frost` (the winter palette) are whole crowns drawn on the same 56x48
    units with the same attachment, so all three blit at one origin and neither is an overlay -
    see the frost file's own note for what changed there.

    Fixed art, deliberately, like every other palm sprite: the colours are in the file and no
    call site multiplies them. The user gets the palms switch and no colour - a frond that
    followed a theme's tree tint would be a frond of the wrong green, which is the same reason
    the roof snow, the awning and the flower clumps carry their own palette.

    Every card is cut paper with its own shadow underneath: the same outline mixed 34 % towards
    #2B2A33 and offset by (2.0, 2.7) units for the large cards, (1.0, 1.4) for the small ones,
    which is the shadow grammar `tools/assets/buildings/core.py` gives the neighbourhood. Edges
    carry a deterministic 0.2-0.6 unit wobble written into the coordinates rather than a filter,
    and there is no stroke anywhere: shapes separate by paper, not by outline.
  -->
