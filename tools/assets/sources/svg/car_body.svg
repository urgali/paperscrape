<svg xmlns="http://www.w3.org/2000/svg" width="285" height="117" viewBox="-46.5 -13 95 39">
<!--
  The saloon, redrawn from the question rather than from its predecessor: what does a handsome
  paper-cutout berlina for this street look like today?

  The v4.18 shell fixed the slab (arches, overhangs, a boot) but kept the old glasshouse, and the
  result was a car that was 43% window: five units of roof over a 20.7-unit pane, bonnet and boot
  reduced to stubs, every body line crowded out by glazing. This drawing starts from the masses a
  saloon is made of and gives each one room. The bonnet runs twenty-seven units from the nose to
  the cowl at (-18,-2); the windscreen rakes over eight units to a roof that clears the glass by
  four; the cabin sits behind the midpoint, and the tail carries a real sixteen-unit deck. The
  beltline rose from 14.7 to 10, so there is more painted door under the glass than glass over the
  door, and a chrome side spear runs nose to tail along it, which is the one long line the old car
  never had. The wheels grew to radius eleven inside matching arch cuts, so they read as part of
  the silhouette instead of as castors, and the body stands two units taller overall: governed
  height is now 50 units and CAR_METRES_TALL moved with it so a unit is still the same pixel.

  Authored in local scene coordinates (the viewBox minimum IS the blit origin), and the glass is
  authored at its drawn size: the v4.6 vertical stretch is retired.

  rc2: the beltline is the glass sprite's own bottom edge and it moved from 10 to 12 when the
  glasshouse grew for table-sized occupants (see car_window.svg), so the chrome spear moved from
  8.2 to 12.3 to stay the beltline's own line, and the door seam sits below it at 14.4. Three
  units of painted door remain between the sill and the arch tops at 15.

  rc5: the cabin lengthens forward so the saloon carries two people again, and it takes the
  length out of the bonnet rather than out of the car. The cowl moves from (-17.8,-2.2) to
  (-25.8,-2.2) and the roof's front corner from -4.5 to -18.5, which stands the windscreen up
  from 43 degrees off vertical to 30 and turns 24.5 units of flat roof into 38.5. **Nothing else
  about the vehicle moves**: the nose is still at -46.5 and the tail at 48.5, the governed height
  is still 50 units and CAR_METRES_TALL still 1.51, the wheels are still at +/-34 inside the same
  arches, the beltline, the spear, the door seam, the lamp patches and the boot deck are the
  paths they were. The masses read 21 / 59 / 15 — bonnet, cabin, deck — where rc4 read
  28.7 / 51.3 / 15: a shorter bonnet on the same car, which is the trade the pane needed and the
  only one available inside a fixed length.
-->
