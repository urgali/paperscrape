<svg xmlns="http://www.w3.org/2000/svg" width="63" height="174" viewBox="0 0 21 58">
  <!--
    The coconut palm's trunk: a curved spindle that leans 7 units to the right over a flared
    foot, with crescent leaf scars up the front, a shadow band down the right flank and a strip
    of light down the left.

    **Its anchor is the foot, and the foot is declared.** The drawn content spans x 2..60 px
    while the foot's centre is at x 24 px (8 local units), because the trunk leans: the
    horizontal centre of what is drawn is *not* where the tree meets the ground, so
    `CONTENT_BOTTOM_CENTRE` - which is true of every straight trunk and was true of the one
    this replaces - would derive 31 px and stand the palm more than two units beside its own
    ground shadow, pivoting its sway off its base. The registry says `DECLARED_ATTACHMENT` at
    (24, 174) for that reason, and `drawPalmTree` blits at (-8, -58), which is that point
    negated.

    The canvas is 21x58 units and carries two pixels of transparent guard on each side, which
    is what `paperscrape-assets normalize` leaves and not slack: a `SCENE_UNITS` blit is
    filtered, so the column beside the ink is the one the sampler reads at the edge, and
    cropping onto the ink makes it clamp and read the ink twice (v4.31, measured at 6 pixels a
    frame on the lake sprites).

    The top of the bark is the canvas's own top row: the crown's attachment is placed two units
    below it, so there is no transparent slack up there to account for.

    Fixed art, deliberately, like every other palm sprite: the colours are in the file and no
    call site multiplies them. The user gets the palms switch and no colour - a frond that
    followed a theme's tree tint would be a frond of the wrong green, which is the same reason
    the roof snow, the awning and the flower clumps carry their own palette.

    Every card is cut paper with its own shadow underneath: the same outline mixed 34 % towards
    #2B2A33 and offset by (2.0, 2.7) units for the large cards, (1.0, 1.4) for the small ones,
    which is the shadow grammar `tools/assets/buildings/core.py` gives the neighbourhood. Edges
    carry a deterministic 0.2-0.6 unit wobble written into the coordinates rather than a filter,
    and there is no stroke anywhere: shapes separate by paper, not by outline.
  -->
