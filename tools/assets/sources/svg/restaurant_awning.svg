<svg xmlns="http://www.w3.org/2000/svg" width="276" height="27" viewBox="0 0 92 9">
<!--
  The canopy, redrawn to be the restaurant's strongest cue instead of its weakest.

  The old awning was 68 units of thin red strip with two cream half-discs that read as teeth at
  scene scale, hung over only part of the frontage. This one spans the whole 92-unit shopfront,
  glass and door alike; seven alternating red and cream stripes, each ending in its own scallop
  lobe, which is the drawing a canopy needs for the scallops to read as scallops rather than as
  blobs. The dark line along the top is the rail it rolls from.

  Blitted at (-46,-53): the lobes end at -44, one unit over the top of the glass at -45, which is
  what a canopy over a window does.
-->
  
<rect x="0" y="0" width="92" height="5.7" fill="#E4623E"></rect>
        <rect x="13.14" y="0" width="13.15" height="5.7" fill="#FBF4E6"></rect>
        <rect x="39.43" y="0" width="13.15" height="5.7" fill="#FBF4E6"></rect>
        <rect x="65.71" y="0" width="13.15" height="5.7" fill="#FBF4E6"></rect>
        <circle cx="6.57" cy="5.7" r="3.28" fill="#E4623E"></circle>
        <circle cx="19.71" cy="5.7" r="3.28" fill="#FBF4E6"></circle>
        <circle cx="32.86" cy="5.7" r="3.28" fill="#E4623E"></circle>
        <circle cx="46" cy="5.7" r="3.28" fill="#FBF4E6"></circle>
        <circle cx="59.14" cy="5.7" r="3.28" fill="#E4623E"></circle>
        <circle cx="72.29" cy="5.7" r="3.28" fill="#FBF4E6"></circle>
        <circle cx="85.43" cy="5.7" r="3.28" fill="#E4623E"></circle>
        <rect x="0" y="0" width="92" height="1.6" fill="#A93B22"></rect>
</svg>
