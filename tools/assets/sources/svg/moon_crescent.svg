<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    Concept B "Scissors" - v4.23 phase 1. The crescent cut out by hand: outer
    limb sampled on the r=99 arc with a +/-2.2 wobble, terminator
    on the rx=58 ellipse with a +/-1.8 wobble, the same paper shadow (+6,+8,
    grey 40 at 20%) and one crater near the limb. Tintable mask,
    one tone + crater.
  The concept's cast shadow is NOT here, by choice and not by
    oversight: at night the sky behind the paper is already dark and
    a shadow would have nothing to darken (and in the lunar mask it would
    drag the mean of the greys below the MULTIPLY floor).
    In Concept B the shadow lives only where there is light behind: the sun.
  -->
