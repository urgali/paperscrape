<svg xmlns="http://www.w3.org/2000/svg" width="297" height="174" viewBox="-49.5 -24.5 99 58">
<!--
  L'autopompa v4.19, riportata all'annata delle tre vetture.

  La 4.18 la lasciava con spigoli vivi e ruote piccole sotto un fondo piatto: due
  generazioni di disegno affiancate sul veicolo piu' grande della scena. Qui prende
  lo stesso vocabolario: archi CONCENTRICI alla ruota con un'unita'-auto d'aria,
  stessi raggi di raccordo, stessa fascia inferiore, stessi fanali (gli sprite
  condivisi con le auto) — e per la prima volta un fanale ROSSO in coda, cosi' la
  direzione si legge dal solo veicolo come sulle vetture.

  Vive nel proprio metro-per-unita': 2,9 m su 68 unita' contro gli 0,0302 m/u delle
  auto, quindi un'unita' qui vale 1.4122 unita'-auto. I raccordi sono scritti
  divisi per quel fattore, cosi' e' il RESO a combaciare, non il numero.

  Ruota r=10.5 (contro le 11 delle auto: 14.8 unita'-auto, piu' grande come
  dev'essere), arco r=11.71, tandem posteriore a 24.7 unita' = 1,175 diametri.
  Tetto cabina -16 contro tetto corpo -24: e' la riga che separa un camion
  da un'auto ingrandita. Terra y=37, fondo scocca y=32.04.
-->
<g fill="#dcdcdc" stroke="#dcdcdc" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
