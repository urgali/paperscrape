<svg xmlns="http://www.w3.org/2000/svg" width="294" height="135" viewBox="1 8 98 45">
<!--
  A fire appliance rather than a red box.

  The proportions were never the problem and are not touched: length over height is 1.66 here
  against a real pumper's 2.5, and a saloon in this same set is 2.02 against a real one's 3.2, so
  the two vehicles are compressed by the same amount and the engine is exactly as elongated
  relative to a car as it should be. What made it read as a big stylised car was the drawing. The
  shell was a single rectangle with one small chamfer; the largest unbroken area in the sprite was
  the blank nose under the windscreen; the cream stripe ran only 52 of the 98 units and stopped
  dead against the cab; and the beacons sat among the ladder's rungs.

  So: the body roof now stands five units proud of the cab roof, which is the one silhouette cue
  that says truck and not car and is why the canvas starts at y=8 instead of y=4. The nose is
  raked over twelve units instead of seven. The stripe runs the full 94 units and crosses the cab.
  Each locker is an aluminium roll-up shutter now: a silver panel with slats inside a darker
  frame. The slat texture is the one visual that says fire appliance and nothing else at this
  scale, and it is what the plain red panels of the earlier drawing were always trying to be.
  Four concepts were rendered side by side before this one was chosen; the plain-panel body
  read as a red box at the far lane, and the shutters still read as equipment bays there. There is a headlight. The ladder is shorter and starts where the body does, so
  the cab roof belongs to the beacons and nothing is drawn over them.

  Two more things arrived with the second pass. The upper body was still one unbroken red
  field, 55 by 19 units and by then the largest flat area left in the drawing, so it carries
  two upper equipment bays; and the chassis grew a front bumper and a rear tailboard, which
  is what an appliance has where a car has nothing. The wheels went with them, to radius ten
  against the saloon's nine, sitting on the same road line.

  The cab window is `rect 10 15 25 17` since rc2 (scene x -40..-15, y -11..6) and is what
  FIRE_TRUCK_SILL_Y_UNITS, FIRE_TRUCK_HEAD_X_UNITS and FIRE_TRUCK_GLASS_HEIGHT_UNITS are measured
  from. It grew from 26x14 at (9,17) when the occupants moved onto the height table: a
  table-sized head with 10-25% of air needs 17 units of glass, the top rises to two units under
  the cab roof, the sill drops to meet the cream stripe, and the left edge steps one unit right
  so the taller pane clears the raked nose.
-->
<g id="paperscrape-outline" fill="#dcdcdc" stroke="#dcdcdc" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round">
  
<path d="M5 52 L5 24 L13 15 L42 15 L42 10 L97 10 L99 12 L99 52 Z"></path>
        <path d="M3 50 L3 22 L11 13 L40 13 L40 8 L95 8 L97 10 L97 50 Z"></path>
