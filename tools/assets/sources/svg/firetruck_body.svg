        <rect x="46" y="17" width="22" height="12"></rect>
        <rect x="71" y="17" width="22" height="12"></rect>
        <rect x="3" y="32" width="94" height="6"></rect>
        <rect x="45" y="39.2" width="15.6" height="7.6"></rect>
