<svg xmlns="http://www.w3.org/2000/svg" width="282" height="198" viewBox="2 0 94 66">
  <!--
    Proposta C, corona di Halloween: le due braccia della forcella proseguono in
    rami nodosi che si allargano quanto si allargava il cuscino. Blit all'origine
    della chioma. Le braccia del tronco arrivano a tela (44,64) e (60,62).
  -->
  <!-- prosecuzione del braccio sinistro: sale piegato a sinistra -->
  <path d="M 42,66 C 39,58 36.5,49 35.5,39 C 34.8,32 35.4,25 37.5,19
           C 38.5,16 40.2,13.5 42.5,11.8
           C 41.2,15 40.4,18.6 40,22.5
           C 39.3,30 40.2,38.5 42.2,46.5 C 43.4,51.5 45,56.5 47,61 L 46,66 Z" fill="#6B4326"/>
  <!-- ramo sinistro esterno, gomito nodoso -->
  <path d="M 38,42 C 31,39 24,34.5 18.5,28 C 15.5,24.4 13.5,20 13,15.4
           C 12.8,13 13.3,10.6 14.5,8.6
           C 14.9,11.6 15.9,14.6 17.5,17.4
           C 20.5,22.8 25.5,27.6 31.5,31.6 C 34.5,33.6 37.5,36.2 40,39.2 Z" fill="#8C5A38"/>
  <!-- punta alta sinistra -->
  <path d="M 39,20 C 36.5,15.5 35.2,10.5 35.5,5 C 35.7,2.8 36.4,0.8 37.6,-0.8
           C 37.7,2 38.2,4.9 39.2,7.8 C 40.4,11.4 42.2,15 44.4,18.2
           C 42.5,18.5 40.7,19.1 39,20 Z" fill="#8C5A38"/>
  <!-- prosecuzione del braccio destro -->
  <path d="M 58,66 C 60,58 62.5,50 66,42.5 C 69.5,35 74.5,28.5 81,23.5
           C 84,21.2 87.5,19.8 91,19.6
           C 88.2,21.4 85.6,23.6 83.2,26.2
           C 77.6,32.2 73,39.8 69.6,47.8 C 67.6,52.6 65.8,57.8 64.4,63 L 62,66 Z" fill="#6B4326"/>
  <!-- ramo destro esterno -->
  <path d="M 68,40 C 74,38.5 80.5,38.5 87,40.5 C 90.5,41.6 93.5,43.6 95.5,46.4
           C 92.5,45.2 89.2,44.6 85.8,44.6 C 80.2,44.6 74.2,46 68.8,48.4 Z" fill="#8C5A38"/>
  <!-- punta alta destra -->
  <path d="M 64,26 C 64.5,20.5 66.5,15 70,10.5 C 71.8,8.2 74,6.6 76.5,5.8
           C 74.7,8 73.2,10.6 72.2,13.5 C 70.8,17.3 70.2,21.7 70.3,26
           C 68.2,25.6 66.1,25.6 64,26 Z" fill="#8C5A38"/>
  <!-- moncone centrale corto fra le braccia -->
  <path d="M 50,50 C 50.5,44 51.5,38 53.5,32.5 C 54.5,29.7 56,27.4 58,25.8
           C 57,28.6 56.3,31.6 55.9,34.9 C 55.4,39.4 55.4,44.4 56,49.4
           C 54,49.2 52,49.4 50,50 Z" fill="#533217"/>
</svg>
