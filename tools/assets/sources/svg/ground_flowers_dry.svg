<svg xmlns="http://www.w3.org/2000/svg" width="108" height="36" viewBox="0 0 36 12">
  <!--
    One clump of ground flowers gone over: thistle, coneflower, goldenrod, a spent aster, a grass
    spike and a seed head, on the same 36x12 canvas as `ground_flowers_bloom` and at the same blit
    origin, so the two are interchangeable at the call site.

    **It serves autumn and winter both**, which is why it is named for what it draws rather than
    for a season: dry stems and seed heads standing out of snow are a real thing to look at, and a
    file called `ground_flowers_autumn` would have been lying every time the winter palette was on.
    The renderer chooses it whenever the seasonal palette is AUTUMN or WINTER; `flowersEnabled`
    still only says whether there are flowers at all.

    Fixed art, for the same reason as its blooming twin: see `ground_flowers_bloom.svg`.

    Same hand as that twin, two cut papers per head (ink shadow offset 0.55 units, light paper over
    it) with scalloped edges, so the two read as one set of artwork under one lamp.

    Everything stands on y=12, the canvas's own bottom edge, so the blit origin puts the stems on
    the ground line and nothing has to be nudged per size.
  -->
