<svg xmlns="http://www.w3.org/2000/svg" width="108" height="36" viewBox="0 0 36 12">
  <!--
    One clump of ground flowers in bloom: five kinds at three sizes on one canvas, so a scattering
    of them is one blit rather than one per bloom.

    **The blooming half of a pair.** `ground_flowers_dry` is the same clump gone over: seed heads,
    thistles and a grass spike instead of petals. The renderer picks between them from the seasonal
    palette (`fallColorsEnabled` / `winterColorsEnabled`), so a meadow in an autumn or a winter
    scene is not a meadow in flower. Neither file is named for a season, because the dry one serves
    two of them and a name that said `autumn` would be a lie every time it snowed.

    Fixed art, deliberately. The user gets ON and OFF and no colour: a meadow whose flowers follow
    a theme's building colour is a meadow of the wrong flowers, and every other decoration that
    carries its own palette (the awning, the roof snow, the sleigh) is fixed for the same reason.

    Every head is two cut papers, the same outline dropped to ink (mixed 34 % with #2B2A33) and
    offset by 0.55 units, with the light paper over it, which is the shadow grammar the v4.32
    buildings are drawn in. Edges are scalloped. Tulip, daisy, buttercup, bluebells, cosmos.

    Everything stands on y=12, the canvas's own bottom edge, so the blit origin puts the stems on
    the ground line and nothing has to be nudged per size.
  -->
  <path d="M5.50 12 Q5.35 9.10 5.20 6.20" stroke="#4E7A3A" stroke-width="0.85" stroke-linecap="round" fill="none"/>
  <path d="M12.50 12 Q12.65 8.40 12.80 4.80" stroke="#4E7A3A" stroke-width="0.85" stroke-linecap="round" fill="none"/>
