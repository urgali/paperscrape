<svg xmlns="http://www.w3.org/2000/svg" width="120" height="27" viewBox="0 0 40 9">
<!--
  v4.19: shortened from 44 units to 40.

  The band is blitted on whichever body wears the livery, and the compact (which is what a taxi
  is now) has its wheels closer together than the saloon: at the band's own row the run of shell
  between its two arch cuts is 42 units, so a 44-unit band hung a unit over each hole with nothing
  behind it but road. Measured on the shipped artwork rather than guessed, and 40 clears both
  bodies (the saloon's run is 54) with a unit of margin at each end.
-->
  
  <defs>
    <pattern id="p_checker" width="16" height="9" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="8" height="4.5" fill="#2B2A33"></rect>
        <rect x="8" y="4.5" width="8" height="4.5" fill="#2B2A33"></rect>
      </pattern>
  </defs>
<rect x="0" y="0" width="40" height="9" fill="#FBF4E6"></rect>
        <rect x="0" y="0" width="40" height="9" fill="url(#p_checker)"></rect>
</svg>
