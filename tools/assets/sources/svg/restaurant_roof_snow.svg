<svg xmlns="http://www.w3.org/2000/svg" width="156" height="24" viewBox="0 2 52 8">
<!--
  Snow for the bow. A quadratic's midpoint sits halfway to its control, so the bow's visual crest
  is at -109, not at its control's -116; the first draft of this drift was placed against the
  control and hovered. This one is built from two quads with a flat crest and real thickness, and
  is blitted at (-26,-111.5) so the crest stands two units proud of the crown and the tapered tips
  die out over the shoulders.
-->
  
<path d="M-0.5 10 Q13 2 26 2 Q39 2 52.5 10 Q39 6.9 26 6.7 Q13 6.9 -0.5 10 Z" fill="#ffffff"></path>
        <path d="M6 8.6 Q15 3.4 26 3.3 Q37 3.4 46 8.6 Q37 6.4 26 6.2 Q15 6.4 6 8.6 Z" fill="#f4f7fa"></path>
</svg>
