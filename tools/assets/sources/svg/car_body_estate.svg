<!--
  Concept C — la Giardinetta: due volumi lunghi, tetto piatto fino al portellone.

  Allungata rispetto alla fase 1 su entrambi i lati come chiesto: il cofano
  guadagna 8 unita' davanti (muso da -58 a -66) e la coda 8 dietro (da 50 a 58),
  per 124 unita' contro le 108 della berlina — il 14,8% in piu'. Il terzo
  finestrino e le barre sul tetto sono cio' che la dice giardinetta a colpo d'occhio.

  Vocabolario condiviso v4.19: fondo scocca y=30, terra y=37,
  ruota r=11 dentro arco concentrico r=12.5 (un'unita' d'aria),
  vano vetro identico sulle tre vetture (cielo -16, davanzale 9).
  Altezza governata: 57.8 unita'. Lunghezza: 124 unita'.
  Coordinate locali di scena: il minimo del viewBox E' l'origine del blit.
  Fronte a sinistra.
-->
