        <rect x="0" y="0" width="100" height="36" fill="#f0f0f0"></rect>
        <rect x="0" y="0" width="100" height="6" fill="#e6e6e6"></rect>
        <rect x="0" y="32" width="100" height="5" fill="#e6e6e6"></rect>
        <rect x="80" y="6" width="20" height="90" fill="#f6f6f6"></rect>
        <rect x="0" y="88" width="100" height="8" fill="#f5f5f5"></rect>
</svg>
