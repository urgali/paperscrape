<svg xmlns="http://www.w3.org/2000/svg" width="168" height="27" viewBox="2 3 56 9">
<g id="paperscrape-outline" fill="#9fb0bd" stroke="#9fb0bd" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round">
  <!-- Snow on the tower's setback roof, which is the only horizontal surface a viewer sees of it.
       The setback's top edge is at y=8 here. Shallower drifts than the houses': a roof this far up
       is swept, and a deep cap would read as a hat. -->
<polygon points="2,9.5 8,6 18,7.5 28,5 38,7 48,5.5 56,7 58,9.5 58,12 2,12"></polygon>
        <polygon points="2,8 8,4.5 18,6 28,3.5 38,5.5 48,4 56,5.5 58,8 58,10.5 2,10.5"></polygon>
</g>
  <!-- Snow on the tower's setback roof, which is the only horizontal surface a viewer sees of it.
       The setback's top edge is at y=8 here. Shallower drifts than the houses': a roof this far up
       is swept, and a deep cap would read as a hat. -->
<polygon points="2,9.5 8,6 18,7.5 28,5 38,7 48,5.5 56,7 58,9.5 58,12 2,12" fill="#DCE7EF"></polygon>
        <polygon points="2,8 8,4.5 18,6 28,3.5 38,5.5 48,4 56,5.5 58,8 58,10.5 2,10.5" fill="#FFFFFF"></polygon>

</svg>
